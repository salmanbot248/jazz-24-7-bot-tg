name: Run JazzDrive Bot

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 */6 * * *'

permissions:
  contents: write   # session/cookie files repo mein push karne ke liye
  actions: write    # 5h40m baad workflow ko dobara chalane ke liye

# Do bot ek saath na chalein (Telegram polling conflict) — naya run purane ke khatam hone ka intezar karega
concurrency:
  group: jazzdrive-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (ffmpeg, fonts, aria2, 7zip)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg aria2 fonts-noto p7zip-full

      - name: Install Deno (yt-dlp signature/nsig solver)
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q -U yt-dlp
          pip install -q -U pytubefix
          pip install -q pyTelegramBotAPI requests requests_toolbelt playwright urllib3 curl_cffi

      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Bot (5 ghante 40 minute tak)
        env:
          PYTHONUNBUFFERED: "1"
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          code=0
          # 340 min = 5h40m. Is ke baad bot band hota hai (60 sec baad force kill) aur neeche naya run shuru hota hai
          timeout -k 60 340m python run_bot.py || code=$?
          echo "Bot exit code: $code"
          # 0 = run_bot.py ne 335 min par khud saaf band kiya, 124 = timeout ne band kiya. Dono mein naya run chahiye
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "RESTART=true" >> "$GITHUB_ENV"
          fi

      - name: Commit updated session/token files back to repo
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f state1.json cookie.json yt_token.json allowed_users.json feed.json instagram_cookies.txt tiktok_cookies.txt tiktok_seen.json tiktok_profiles.json tiktok_failed.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto-update session/token files [skip ci]"
          git pull --rebase --autostash || true
          git push || echo "Nothing to push or push failed"

      - name: Auto restart (naya run shuru karo)
        if: env.RESTART == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "$GITHUB_WORKFLOW" --ref "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          
